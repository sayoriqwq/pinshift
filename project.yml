name: Pinshift

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

fileGroups:
  - Fixtures

targets:
  Pinshift:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App
      - path: Sources/ControllerLink
      - path: Sources/LocationDomain
      - path: Sources/SimulationDiagnostics
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/Pinshift-Info.plist
        MARKETING_VERSION: 1.0.2
        PRODUCT_BUNDLE_IDENTIFIER: dev.sayori.pinshift
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      gatherCoverageData: false
      testTargets:
        - PinshiftUITests
        - PinshiftTests

  PinshiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PinshiftTests
    dependencies:
      - target: Pinshift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.sayori.pinshift.tests

  PinshiftUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Tests/PinshiftUITests
    dependencies:
      - target: Pinshift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          UI tests use local-network access only when explicitly exercising Controller Link behavior.
        PRODUCT_BUNDLE_IDENTIFIER: dev.sayori.pinshift.uitests
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: 1
